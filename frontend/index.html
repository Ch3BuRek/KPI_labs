<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MYSITE</title>
<link rel="stylesheet" href="styles/styles.css"/>
</head>
<body>

<header class="header">
    <div class="header-logo">logo</div>
    <button id="cart-btn" class="cart-btn">
        Cart (<span id="cart-count">0</span>)
    </button>
</header>

<div class="restaurant-hero">
    <div class="restaurant-info">
        <h1 class="restaurant-name">Заклад</h1>
        <div class="restaurant-meta">
            <span class="meta-badge">96%</span>
            <span>10-25 хв</span>
            <span>Безкоштовна доставка</span>
        </div>
    </div>
</div>

<main class="customer-layout"> 
    <nav class="cat-sidebar" id="cat-sidebar">
        <ul class="cat-list" id="cat-tabs"></ul>
    </nav>

    <section class="menu-section" id="menu-section">
        <div id="menu-grid" class="menu-list"></div>
    </section>

    <aside class="cart-panel" id="cart-panel">
        <h3 class="cart-title">Ваше замовлення</h3>

        <div class="field-group">
            <label for="address-input">Адреса доставки</label>
            <input id="address-input" type="text" placeholder="Введіть адресу доставки" value="Контрактова площа, 123"/>
        </div>

        <div id="cart-items" class="cart-items">
            <p class="empty">Поки що порожньо</p>
        </div>

        <div id="cart-totals" class="cart-totals hidden"></div>

        <button id="place-order-btn" class="btn-primary" disabled>Замовити</button>
    </aside>
</main>

<script type="module" src="script/index.js"></script>
</body>
</html>
