<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MYSITE</title>
<link rel="stylesheet" href="styles/styles.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<header class="header">
    <div class="header-logo">logo<span class="tag">Manager</span></div>
</header>

<section class="stats-bar">
    <div class="stat">
        <div class="stat-label">Total orders today</div>
        <div class="stat-value" id="s-total">0</div>
    </div>
    <div class="stat">
        <div class="stat-label">Active in kitchen</div>
        <div class="stat-value" id="s-active">0</div>
    </div>
    <div class="stat">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="s-completed">0</div>
    </div>
    <div class="stat">
        <div class="stat-label">Revenue</div>
        <div class="stat-value" id="s-revenue">$0</div>
    </div>
</section>

<main class="page manager-page"> 
    <section class="panel panel-kitchen">
        <div class="panel-header">
            <h2>Kitchen display</h2>
        </div>
        <div class="kitchen-grid" id="kitchen-grid">
            <div class="empty-state">No orders in the kitchen</div>
        </div>
    </section>

    <section class="panel panel-tables">
        <div class="panel-header">
            <h2>Delivery map</h2>
        </div>
        <div id="map"></div>
    </section>

    <section class="panel panel-activity">
        <div class="panel-header">
            <h2>Activity</h2>
        </div>
    </section>
</main>

<div id="login-overlay" class="login-overlay hidden">
    <div class="login-box">
        <h2>Manager Login</h2>
        <input id="login-username" type="text" placeholder="Username" autocomplete="username"/>
        <input id="login-password" type="password" placeholder="Password" autocomplete="current-password"/>
        <button id="login-btn" class="btn-primary">Login</button>
        <p id="login-error" class="login-error"></p>
    </div>
</div>

<script type="module" src="script/manager.js"></script>
</body>
</html>
